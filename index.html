<!DOCTYPE html>
<html lang="es-UY">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haras Al Galope — Cuarto de Milla de carrera | San José, Uruguay</title>
<meta name="description" content="Haras Al Galope: cría y selección de Cuarto de Milla de carrera en Libertad, San José, Uruguay. Servicios de padrillo, centro reproductivo y remate anual.">
<meta name="theme-color" content="#11256C">

<meta property="og:type" content="website">
<meta property="og:title" content="Haras Al Galope — Cuarto de Milla de carrera">
<meta property="og:description" content="Criamos para llegar primero. Cría y selección de Cuarto de Milla de carrera en Libertad, San José, Uruguay.">
<meta property="og:locale" content="es_UY">
<meta property="og:image" content="assets/img/og.jpg">

<link rel="icon" type="image/png" href="assets/img/icono.png">
<link rel="icon" type="image/png" href="assets/img/icono-claro.png" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="assets/img/icono.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Anton es la tipografía del logo del haras. Archivo trae ejes de peso y de
     ancho: el ancho comprimido se usa en las columnas de datos, como en un
     programa de carreras. De Bodoni sólo la itálica, para el lema. -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wdth,wght@62..125,400..700&family=Bodoni+Moda:ital,opsz,wght@1,6..96,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<a class="salto" href="#indice">Ir al índice</a>

<!-- Los hierros. Van RELLENOS y asimétricos: un hierro se corta de planchuela
     de un espesor y la piel quemada cierra los huecos finos. Espesor mínimo
     10% de la altura. Nada de trazo de 2px, que es la firma de Lucide. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="h-haras" viewBox="0 0 40 40">
    <path d="M6 30h4V14l10 8 10-8v16h4V6l-14 11L6 6z"/>
  </symbol>
  <symbol id="h-padrillo" viewBox="0 0 40 40">
    <path d="M8 34V16l8-10 4 6 4-6 8 10v18h-6V22l-6-7-6 7v12z"/>
  </symbol>
  <symbol id="h-martillo" viewBox="0 0 40 40">
    <path d="M4 34h20v4H4zM22 4l14 14-5 5L17 9zM13 13l9 9-9 9-9-9z"/>
  </symbol>
  <symbol id="h-copa" viewBox="0 0 40 40">
    <path d="M10 4h20v10a10 10 0 0 1-7 9.5V30h6v6H11v-6h6v-6.5A10 10 0 0 1 10 14zM4 8h4v8H4zM32 8h4v8h-4z"/>
  </symbol>
  <symbol id="h-planilla" viewBox="0 0 40 40">
    <path d="M8 4h24v32H8zm5 7h14v3H13zm0 7h14v3H13zm0 7h9v3h-9z"/>
  </symbol>
</defs></svg>


<!-- ═══════════ 1 · TAPA ═══════════ -->
<header class="membrete">
  <div class="hoja membrete__in" style="display:flex;align-items:center;justify-content:space-between;gap:20px">
    <img class="membrete__logo" src="assets/img/logo.png" alt="Haras Al Galope" width="900" height="598">
    <p class="membrete__sitio" id="membreteSitio"></p>
  </div>
</header>

<main id="main">

<section class="hoja tapa">
  <h1 class="tapa__nombre">AL&nbsp;GALOPE</h1>

  <div class="tapa__cuerpo">
    <figure class="tapa__lamina" style="margin:0">
      <img id="tapaFoto" alt="" width="1500" height="1000">
      <!-- El lema. Lo fijó el cliente con una captura: no se rediseña. -->
      <p class="tapa__lema" id="tapaLema"></p>
    </figure>

    <div class="tapa__texto">
      <p class="tapa__condiciones" id="tapaCondiciones"></p>
    </div>
  </div>
</section>


<!-- ═══════════ 2 · ÍNDICE — es toda la navegación ═══════════ -->
<nav class="hoja indice" id="indice" aria-label="Índice">
  <ol id="indiceLista"></ol>
</nav>


<!-- ═══════════ 3 · LOGROS — sin título, un párrafo y nada más ═══════════ -->
<section class="hoja logros">
  <p id="logrosTexto"></p>
</section>


<!-- ═══════════ 4 · LA VARA — sin título ═══════════ -->
<section class="hoja vara" id="vara" aria-label="Índice de velocidad de los padrillos">
  <div class="vara__caja" id="varaCaja"></div>
  <p class="vara__sin" id="varaSin"></p>
  <p class="vara__vende" id="varaVende"></p>
</section>


<!-- ═══════════ 5 · PADRILLOS ═══════════ -->
<section class="hoja seccion" id="padrillos">
  <h2 class="titulo-seccion">PADRILLOS</h2>
  <div id="padrillosLista"></div>
</section>


<!-- ═══════════ 6 · EL HARAS — sin título, asimétrica ═══════════ -->
<section class="hoja haras" id="haras">
  <figure class="haras__foto" style="margin:0">
    <img id="harasFoto" alt="" width="1200" height="1200">
  </figure>
  <div class="haras__txt" id="harasTexto"></div>
</section>


<!-- ═══════════ 7 · PALMARÉS ═══════════ -->
<section class="hoja seccion" id="caballos">
  <div class="filtros" id="filtros"></div>
  <table class="carta">
    <thead>
      <tr>
        <th class="carta__rot" scope="col">PALMARÉS</th>
        <th scope="col">Sexo</th>
        <th scope="col" class="num">Año</th>
        <th scope="col">Padre y madre</th>
        <th scope="col" class="logro">Principal logro</th>
      </tr>
    </thead>
    <tbody id="cartaCuerpo"></tbody>
    <tfoot><tr><td colspan="5"></td></tr></tfoot>
  </table>
</section>


<!-- ═══════════ 8 · REPRODUCCIÓN — sin título, campo plata ═══════════ -->
<section class="repro" id="reproduccion" hidden>
  <div class="hoja">
    <div class="repro__cab">
      <figure class="repro__retrato" id="reproRetrato" hidden style="margin:0"></figure>
      <div>
        <p class="repro__rol" id="reproRol"></p>
        <p class="repro__vet" id="reproVet"></p>
      </div>
    </div>

    <p class="repro__intro" id="reproIntro"></p>

    <div class="repro__cuerpo">
      <ul class="planilla" id="reproProcedimientos"></ul>
      <dl class="recursos" id="reproRecursos"></dl>
    </div>

    <div class="tira" id="reproFotos" hidden></div>

    <div id="reproCta"></div>
  </div>
</section>


<!-- ═══════════ 9 · SERVICIOS — sin título ═══════════ -->
<section class="hoja servicios" id="servicios">
  <div id="serviciosLista"></div>
</section>


<!-- ═══════════ 10 · EL REMATE — único campo marino a sangre ═══════════ -->
<section class="remate" id="remate">
  <div class="hoja">
    <div class="remate__cab">
      <p class="remate__caja" id="remateN"></p>
      <h2 id="remateTitulo"></h2>
      <p class="remate__caja" id="remateHora"></p>
    </div>

    <p class="remate__dia" id="remateDia"></p>
    <p class="remate__cuenta" id="remateCuenta"></p>

    <table class="condiciones"><tbody id="remateCondiciones"></tbody></table>

    <p class="remate__linea" id="remateInvitados"></p>
    <p class="remate__linea" id="remateTransmite"></p>

    <a class="remate__ir" id="remateIr" target="_blank" rel="noopener"></a>
  </div>
</section>


<!-- ═══════════ 11 · NOVEDADES — sin cabecera, arranca en una fecha ═══════════ -->
<section class="hoja novedades" id="novedades">
  <div id="novedadesLista"></div>
</section>


<!-- ═══════════ 12 · GALERÍA — sin cabecera ═══════════ -->
<section class="hoja galeria" id="galeria">
  <div class="contactos" id="galeriaTira"></div>
  <button class="galeria__mas" id="galeriaMas" type="button" hidden></button>
</section>


<!-- ═══════════ 13 · CONTACTO ═══════════ -->
<section class="hoja contacto" id="contacto">
  <div class="anclas" id="anclas"></div>

  <!-- Croquis dibujado a mano en lugar del iframe de Google: el iframe son
       entre 400 y 800 KB de mosaicos, y esto lo mira un comprador con datos
       móviles en la campaña. -->
  <div class="croquis">
    <svg viewBox="0 0 800 320" role="img" aria-label="Croquis de ubicación: Libertad, San José, sobre la Ruta 1">
      <rect width="800" height="320" fill="#FBFBFD"/>
      <path d="M0 214 H800" stroke="#11256C" stroke-width="3" fill="none"/>
      <path d="M300 320 V214" stroke="#6E7BA3" stroke-width="1.5" fill="none"/>
      <path d="M560 0 V214" stroke="#6E7BA3" stroke-width="1.5" fill="none"/>
      <text x="18" y="240" font-family="Archivo, Arial" font-size="17" fill="#4A5573">Ruta 1</text>
      <text x="306" y="300" font-family="Archivo, Arial" font-size="17" fill="#4A5573">a Montevideo</text>
      <text x="566" y="30" font-family="Archivo, Arial" font-size="17" fill="#4A5573">Libertad</text>
      <use href="#h-haras" x="392" y="140" width="46" height="46" fill="#11256C"/>
      <text x="392" y="128" font-family="Archivo, Arial" font-size="19" font-weight="700" fill="#0B1436">Haras Al Galope</text>
    </svg>
  </div>
  <a class="contacto__ir" id="contactoMapa" target="_blank" rel="noopener">Abrir en Google Maps →</a>

  <p class="contacto__redes" id="contactoRedes"></p>
</section>

</main>


<!-- ═══════════ 14 · CINTA ═══════════ -->
<aside class="cinta" id="cinta" hidden aria-label="Novedades del haras">
  <div class="cinta__riel" id="cintaRiel"></div>
</aside>

<!-- main.js define cómo se dibuja; contenido.js trae qué se dibuja. -->
<script src="assets/js/main.js"></script>
<script src="assets/js/contenido.js"></script>
</body>
</html>
