<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panel — Haras Al Galope</title>
<link rel="icon" href="logo.png">

<style>
/* ══════════════════════════════════════════════════════════════════════════
   EL PANEL, CON LOS COLORES DEL HARAS

   Sveltia arma toda su interfaz a partir de un sistema de variables --sui-*.
   Se recolorea por ahí y no tocando sus clases: las clases llevan un hash
   (svelte-7y4msj) que cambia en cada actualización, las variables no.

   Si algún día renombran una variable, lo único que pasa es que el panel
   vuelve a su celeste por defecto. No se rompe nada.
   ══════════════════════════════════════════════════════════════════════════ */

/* El !important no es capricho: Sveltia inyecta su hoja de estilo cuando
   arranca, o sea DESPUÉS de ésta, y con la misma especificidad gana la
   última. Sin esto el panel se queda con su celeste de fábrica. */
:root{
  /* Todo el panel deriva de este número. 210 es el celeste de fábrica;
     227 es el tono del azul del logo (#11256C). Con cambiarlo, los grises
     dejan de ser neutros y se van a la familia del haras. */
  --sui-base-hue: 227 !important;

  /* El azul del logo puro es muy oscuro para un botón: no se lee como algo
     apretable. Se sube la luminosidad y se mantiene el tono. */
  --sui-primary-accent-color: hsl(227 68% 40%) !important;
  --sui-primary-accent-color-dark: hsl(227 70% 32%) !important;
  --sui-primary-accent-color-light: hsl(227 60% 55%) !important;

  /* El dorado del haras para el foco del teclado. Es el detalle que hace que
     no parezca un panel genérico: ningún otro sitio tiene este amarillo. */
  --sui-focus-ring-color: rgba(212, 174, 99, .75) !important;
  --sui-focus-ring-width: 2px !important;
}

/* ── La pantalla de entrada ────────────────────────────────────────────────
   Se le pone atrás la foto de portada, oscurecida bajo un lavado azul, para
   que el dueño abra algo que se parece a su haras y no una herramienta.

   Sólo se aplica cuando existe el contenedor del login (:has). Adentro del
   panel ya trabajando, una foto de fondo sería ruido. */
body{
  background:
    linear-gradient(180deg, rgba(10,17,34,.78), rgba(17,37,108,.86)),
    url('../assets/img/hero.jpg') center/cover no-repeat fixed #0a1122;
}

/* Sveltia pinta sus propios fondos opacos encima. Se los volvemos
   transparentes nada más que en la pantalla de entrada.

   La condición es la estructura exacta del login (el logo grande dentro del
   contenedor centrado). Se escribe así de específica a propósito: si una
   actualización la cambia, esto deja de aplicar y el panel se ve como el de
   fábrica. Prefiero eso a que la foto se cuele detrás del editor. */
.sui.app-shell:has(> .outer > .main > .container .inner > img.logo){
  background: transparent;
}
.sui.app-shell:has(> .outer > .main > .container .inner > img.logo) > .outer,
.sui.app-shell:has(> .outer > .main > .container .inner > img.logo) > .outer > .main{
  background: transparent;
}

/* En un celular acostado la pantalla de entrada no entra, y Sveltia la
   recorta con overflow:hidden: los botones de iniciar sesión quedan abajo
   del borde y no se puede llegar a ellos. Acá se deja bajar.
   Sólo en la pantalla de entrada: adentro del editor no se toca nada. */
.sui.app-shell:has(> .outer > .main > .container .inner > img.logo) > .outer > .main{
  overflow-y: auto;
}

/* El logo, grande y con un halo suave para que no quede pegado sobre la foto.
   Sveltia le fija 160px, que sobre una foto a pantalla completa queda perdido.
   Se mide contra el alto de la ventana para que no se coma la pantalla en un
   celular apaisado, y contra el ancho para que no se salga en uno angosto. */
.container .inner > img.logo{
  width: auto !important;
  height: min(340px, 38vh) !important;
  max-width: 84vw !important;
  filter: drop-shadow(0 10px 34px rgba(0,0,0,.55));
}

/* Pantalla baja (celular acostado): el logo cede lugar para que los botones
   de iniciar sesión entren sin tener que bajar. */
@media (max-height: 560px){
  .container .inner > img.logo{ height: min(150px, 30vh) !important }
}

/* Los textos de la pantalla de entrada van sobre foto: hay que aclararlos,
   porque el panel los calcula para fondo claro. */
.container .inner h1,
.container .inner p{
  color:#f2f5fa;
  text-shadow:0 2px 18px rgba(0,0,0,.6);
}

/* Con el sistema en modo oscuro la foto ya contrasta sola: se baja el lavado
   para que no quede una pantalla negra. */
@media (prefers-color-scheme: dark){
  body{
    background:
      linear-gradient(180deg, rgba(6,10,22,.82), rgba(13,23,48,.9)),
      url('../assets/img/hero.jpg') center/cover no-repeat fixed #060a16;
  }
}

/* En celular la foto fija se ve mal y consume batería: se ancla normal. */
@media (max-width:640px){
  body{ background-attachment: scroll }
}

/* ── Botones propios ───────────────────────────────────────────────────────
   Van abajo a la izquierda: la derecha es donde el panel pone sus botones de
   guardar y publicar. */
.barra-propia{
  position:fixed; left:16px; bottom:calc(16px + env(safe-area-inset-bottom, 0px));
  z-index:9999; display:flex; gap:8px; flex-wrap:wrap;
}
.ver-sitio{
  display:inline-flex; align-items:center; gap:.5rem;
  min-height:44px;                     /* zona de toque cómoda */
  padding:.7rem 1.2rem; border-radius:999px;
  background:#11256C; color:#f2f5fa; text-decoration:none;
  border:1px solid rgba(212,174,99,.55);
  font:600 .88rem/1 system-ui, sans-serif; letter-spacing:.04em;
  box-shadow:0 6px 24px rgba(0,0,0,.35);
  transition:background-color .2s, transform .2s, border-color .2s;
}
.ver-sitio:hover, .ver-sitio:focus-visible{
  background:#1a3490; border-color:#d4ae63; transform:translateY(-2px);
}
.ver-sitio:focus-visible{ outline:2px solid #d4ae63; outline-offset:2px }
.ver-sitio svg{ width:15px; height:15px; fill:none;
  stroke:#d4ae63; stroke-width:2; stroke-linecap:round; stroke-linejoin:round }
.ver-sitio[disabled]{ opacity:.65; pointer-events:none }
.ver-sitio.listo{ background:#0f5c2e; border-color:#3e9e63 }

/* Toque mínimo cómodo en el celular */
@media (max-width:640px){
  .ver-sitio{ padding:.85rem 1.2rem; font-size:.95rem }
}
</style>
</head>
<body>
<!-- Sveltia CMS. Lee el config.yml de al lado y anda bien en el celular, que
     es donde el dueño va a cargar las fotos.

     La versión va fijada a propósito: sin fijarla, unpkg sirve siempre la
     última y el panel podría cambiar o romperse de un día para el otro sin
     que nadie tocara nada. Para actualizarlo se sube este número a mano,
     después de probarlo. -->
<script src="https://unpkg.com/@sveltia/cms@^0.176.1/dist/sveltia-cms.js"></script>

<div class="barra-propia">
  <!-- Va en una pestaña nueva a propósito: si abriera el sitio en la misma, se
       perdería lo que se esté editando sin guardar. -->
  <a class="ver-sitio" href="../" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
      <path d="M15 3h6v6"/><path d="M10 14 21 3"/>
    </svg>
    Ver la web
  </a>

  <button class="ver-sitio" id="refrescar" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/>
    </svg>
    <span>Refrescar</span>
  </button>
</div>

<script>
/* ── Refrescar la caché ────────────────────────────────────────────────────
   El navegador guarda el sitio unos diez minutos. Después de publicar un
   cambio, eso hace que uno lo vaya a mirar y siga viendo lo viejo — y crea
   que no se guardó.

   Este botón vuelve a pedir cada archivo del sitio salteando la caché
   (cache:'reload' obliga a ir al servidor), y recién ahí abre la web. */
(function () {
  var ARCHIVOS = [
    '', 'index.html',
    'assets/css/style.css', 'assets/js/main.js', 'assets/js/contenido.js',
    'content/sitio.json', 'content/remate.json', 'content/cinta.json',
    'content/padrillos.json', 'content/caballos.json', 'content/servicios.json',
    'content/novedades.json', 'content/galeria.json', 'content/reproduccion.json'
  ];

  var boton = document.getElementById('refrescar');
  var texto = boton.querySelector('span');

  boton.addEventListener('click', async function () {
    var original = texto.textContent;
    boton.disabled = true;
    texto.textContent = 'Refrescando…';

    try {
      // por si alguna vez se agrega un service worker
      if (window.caches && caches.keys) {
        var llaves = await caches.keys();
        await Promise.all(llaves.map(function (k) { return caches.delete(k); }));
      }
      await Promise.all(ARCHIVOS.map(function (f) {
        return fetch('../' + f, { cache: 'reload' }).catch(function () {});
      }));
    } catch (e) { /* si algo falla igual conviene abrir el sitio */ }

    texto.textContent = 'Listo';
    boton.classList.add('listo');
    // la marca de tiempo asegura que la pestaña nueva no salga de la caché
    window.open('../?actualizado=' + Date.now(), '_blank', 'noopener');

    setTimeout(function () {
      texto.textContent = original;
      boton.classList.remove('listo');
      boton.disabled = false;
    }, 2500);
  });
})();
</script>
</body>
</html>
