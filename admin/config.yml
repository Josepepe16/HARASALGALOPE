# ============================================================================
#  PANEL DE ADMINISTRACIÓN — Haras Al Galope
#
#  Cada bloque de "singletons" es una pantalla del panel, y aparece derecho
#  en la lista de la izquierda: un clic y estás editando.
#
#  Están ordenadas por cuánto se tocan, no por importancia: arriba lo de todos
#  los días, abajo lo que casi nunca cambia.
# ============================================================================

# El login es con cuenta de GitHub. Quien edite tiene que ser colaborador
# del repositorio.
backend:
  name: github
  repo: Josepepe16/HARASALGALOPE
  branch: main
  commit_messages:
    create: 'Agrega {{collection}} “{{slug}}”'
    update: 'Actualiza {{collection}} “{{slug}}”'
    delete: 'Borra {{collection}} “{{slug}}”'
    uploadMedia: 'Sube la imagen {{path}}'
    deleteMedia: 'Borra la imagen {{path}}'

# Las fotos que suban van todas a la misma carpeta que las actuales.
media_folder: 'assets/img'
# Tiene que ser absoluta desde la raíz del dominio, INCLUYENDO el nombre del
# repositorio: el panel se sirve desde /admin/, un nivel más adentro que el
# sitio, y una ruta relativa ahí apunta a /admin/assets/img/… que no existe.
# Por eso en el panel se veían las fotos rotas.
#
# El sitio no depende de esto: contenido.js normaliza cualquier forma que
# venga guardada. Si algún día se conecta un dominio propio y el sitio pasa a
# estar en la raíz, acá va simplemente /assets/img
public_folder: '/HARASALGALOPE/assets/img'

locale: 'es'
publish_mode: simple         # se publica al guardar, sin pasos intermedios

# ── Cómo se ve el panel ──────────────────────────────────────────────────────
app_title: 'Haras Al Galope'
logo:
  src: logo.png
  # En el encabezado no: ahí el fondo es claro y el logo es blanco.
  # Va sólo en la pantalla de entrada, que tiene la foto de fondo.
  show_in_header: false
site_url: 'https://josepepe16.github.io/HARASALGALOPE/'

singletons:

  # ══ LO DE TODOS LOS DÍAS ═══════════════════════════════════════════════════

  - name: cinta
    label: 'Cinta de abajo'
    icon: campaign
    file: 'content/cinta.json'
    fields:
      - label: 'Color de la cinta'
        name: color
        widget: color
        allow_input: true
        default: '#03571f'
        hint: 'El verde que está puesto se sacó del afiche de Favorito Verde. Se puede cambiar por cualquier otro.'
      - label: 'Mensajes'
        name: mensajes
        widget: list
        summary: '{{fields.texto}}'
        hint: 'Se van turnando en bucle. Si la dejás vacía, la cinta desaparece del sitio.'
        fields:
          - { label: 'Texto', name: texto, widget: string }

  - name: novedades
    label: 'Novedades'
    icon: newspaper
    file: 'content/novedades.json'
    fields:
      - label: 'Novedades'
        name: items
        widget: list
        summary: '{{fields.fecha}} — {{fields.titulo}}'
        hint: 'Poné la más nueva arriba de todo. Se arrastran para ordenar.'
        fields:
          - { label: 'Fecha', name: fecha, widget: datetime, type: date,
              format: 'YYYY-MM-DD' }
          - { label: 'Etiqueta', name: etiqueta, widget: string,
              hint: 'Una palabra: Remate, Carrera, Maroñas, Tambores…' }
          - { label: 'Título', name: titulo, widget: string }
          - { label: 'Texto', name: texto, widget: text }
          - { label: 'Link (opcional)', name: link, widget: string, required: false }
          - { label: 'Texto del link', name: linkTexto, widget: string, required: false,
              hint: 'Por ejemplo: Ver el remate' }

  - name: galeria
    label: 'Galería de fotos'
    icon: photo_library
    file: 'content/galeria.json'
    fields:
      - { label: 'Cuántas se ven al entrar', name: visibles, widget: number,
          value_type: int, min: 1, max: 40,
          hint: 'El resto queda detrás del botón “Ver más fotos”.' }
      - label: 'Fotos'
        name: items
        widget: list
        summary: '{{fields.alt}}'
        hint: 'Arrastrá para cambiar el orden. La primera se muestra al doble de tamaño.'
        fields:
          - { label: 'Foto', name: foto, widget: image }
          - { label: 'Descripción', name: alt, widget: string,
              hint: 'Qué se ve. Lo leen los buscadores y los lectores de pantalla.' }
          - { label: 'Encuadre', name: pos, widget: string, required: false,
              hint: 'Sólo si queda mal centrada. Ejemplos: 50% 30% (sube), 70% 50% (corre a la derecha).' }

  - divider: true

  # ══ EL REMATE ══════════════════════════════════════════════════════════════

  - name: remate
    label: 'Remate'
    icon: gavel
    file: 'content/remate.json'
    fields:
      - { label: 'Título', name: titulo, widget: string, hint: 'Por ejemplo: 7° Remate Anual' }
      - { label: 'Subtítulo', name: subtitulo, widget: string }
      - { label: 'Fecha y hora exactas', name: fechaISO, widget: datetime,
          format: "YYYY-MM-DDTHH:mm:ss-03:00", date_format: 'DD/MM/YYYY', time_format: 'HH:mm',
          hint: 'Esto maneja la cuenta regresiva de la portada. Cuando pasa, cambia sola.' }
      - { label: 'Fecha escrita', name: fechaTexto, widget: string,
          hint: 'Como se muestra. Por ejemplo: Jueves 14 de agosto de 2026' }
      - { label: 'Hora escrita', name: hora, widget: string }
      - { label: 'Modalidad', name: modalidad, widget: string }
      - { label: 'Lugar', name: lugar, widget: string }
      - { label: 'Rematador', name: rematador, widget: string }
      - { label: 'Link al remate', name: link, widget: string }
      - { label: 'Premios', name: premio, widget: string, required: false }
      - label: 'Transmite'
        name: transmite
        widget: list
        summary: '{{fields.nombre}}'
        fields: [{ label: 'Nombre', name: nombre, widget: string }]
      - label: 'Haras invitados'
        name: invitados
        widget: list
        summary: '{{fields.nombre}}'
        fields: [{ label: 'Nombre', name: nombre, widget: string }]
      - label: 'Condiciones de venta'
        name: condiciones
        widget: list
        summary: '{{fields.texto}}'
        fields: [{ label: 'Condición', name: texto, widget: text }]

  - divider: true

  # ══ LOS CABALLOS ═══════════════════════════════════════════════════════════

  - name: padrillos
    label: 'Padrillos'
    icon: pets
    file: 'content/padrillos.json'
    fields:
      - label: 'Padrillos'
        name: items
        widget: list
        summary: '{{fields.nombre}}'
        hint: 'Arrastrá para cambiar el orden en que aparecen.'
        fields:
          - { label: 'Nombre', name: nombre, widget: string }
          - { label: 'Foto', name: foto, widget: image, required: false,
              hint: 'Cualquier foto sirve: el sitio la acomoda sola, no hace falta recortarla.' }
          - { label: 'Índice de velocidad', name: indice, widget: string, required: false,
              hint: 'Por ejemplo: AAAT 104' }
          - { label: 'Bajada', name: titular, widget: string, required: false,
              hint: 'Se muestra si no hay índice de velocidad.' }
          - { label: 'Mostrar cartelito', name: destacado, widget: boolean, default: true }
          - { label: 'Texto del cartelito', name: etiqueta, widget: string, required: false,
              hint: 'Si lo dejás vacío dice “Destacado”.' }
          - { label: 'Padre', name: padre, widget: string, required: false }
          - { label: 'Madre', name: madre, widget: string, required: false }
          - { label: 'Reseña', name: resumen, widget: text }
          - label: 'Ficha'
            name: ficha
            widget: list
            summary: '{{fields.dato}}: {{fields.valor}}'
            hint: 'Las filas de la ficha completa que se abre al tocar la tarjeta.'
            fields:
              - { label: 'Dato', name: dato, widget: string, hint: 'Padre, Madre, Campaña…' }
              - { label: 'Valor', name: valor, widget: text }
          - label: 'Hijos destacados'
            name: hijos
            widget: list
            summary: '{{fields.nombre}}'
            required: false
            fields: [{ label: 'Nombre', name: nombre, widget: string }]

  - name: caballos
    label: 'Palmarés'
    icon: emoji_events
    file: 'content/caballos.json'
    fields:
      - label: 'Caballos'
        name: items
        widget: list
        summary: '{{fields.nombre}} — {{fields.titulo}}'
        fields:
          - { label: 'Nombre', name: nombre, widget: string }
          - label: 'Categoría'
            name: categoria
            widget: select
            options:
              - { label: 'Carrera', value: carrera }
              - { label: 'Tambores', value: tambores }
              - { label: 'Madres', value: madres }
          - { label: 'Sexo', name: sexo, widget: select, required: false,
              options: ['Macho', 'Hembra'] }
          - { label: 'Año de nacimiento', name: anio, widget: number, required: false,
              value_type: int, min: 1990, max: 2100 }
          - { label: 'Padre', name: padre, widget: string, required: false }
          - { label: 'Madre', name: madre, widget: string, required: false }
          - { label: 'Logro principal', name: titulo, widget: string, required: false,
              hint: 'Se muestra destacado. Por ejemplo: Campeón 8° Potro del Futuro' }
          - label: 'Logros'
            name: logros
            widget: list
            summary: '{{fields.texto}}'
            fields: [{ label: 'Logro', name: texto, widget: text }]

  - divider: true

  # ══ LO QUE CASI NO CAMBIA ══════════════════════════════════════════════════

  - name: servicios
    label: 'Servicios'
    icon: handshake
    file: 'content/servicios.json'
    fields:
      - label: 'Servicios'
        name: items
        widget: list
        summary: '{{fields.titulo}}'
        fields:
          - label: 'Ícono'
            name: icono
            widget: select
            options:
              - { label: 'Padrillo', value: stallion }
              - { label: 'Martillo de remate', value: gavel }
              - { label: 'Trofeo', value: trophy }
              - { label: 'Planilla', value: clipboard }
          - { label: 'Título', name: titulo, widget: string }
          - { label: 'Texto', name: texto, widget: text }
          - label: 'Detalles'
            name: detalles
            widget: list
            summary: '{{fields.texto}}'
            fields: [{ label: 'Detalle', name: texto, widget: string }]

  - name: reproduccion
    label: 'Centro reproductivo'
    icon: vaccines
    file: 'content/reproduccion.json'
    fields:
      - { label: 'Mostrar la sección en el sitio', name: activa, widget: boolean, default: true,
          hint: 'Si la apagás, la sección y su enlace del menú desaparecen.' }
      - { label: 'Volanta', name: eyebrow, widget: string,
          hint: 'La línea chica dorada de arriba del título.' }
      - { label: 'Título', name: titulo, widget: string }
      - { label: 'Última palabra del título', name: tituloItalica, widget: string, required: false,
          hint: 'Se muestra en dorado, como en el resto de los títulos del sitio.' }
      - { label: 'Bajada', name: intro, widget: text }
      - { label: 'Quién está a cargo', name: responsable, widget: string,
          hint: 'Por ejemplo: Vet. Fernanda Duarte' }
      - { label: 'Rol', name: rol, widget: string,
          hint: 'La línea chica de arriba del nombre.' }
      - { label: 'Foto de quien está a cargo', name: fotoResponsable, widget: image, required: false,
          hint: 'Se muestra redonda y chica. Si no cargás ninguna, no aparece nada.' }
      - { label: 'Encuadre de esa foto', name: fotoResponsablePos, widget: string, required: false,
          hint: 'Sólo si queda mal centrada. Por defecto toma un poco arriba del centro, que es donde suele estar la cara.' }
      - { label: 'Número grande', name: cifra, widget: string,
          hint: 'Por ejemplo: +100' }
      - { label: 'Qué cuenta ese número', name: cifraTexto, widget: string,
          hint: 'Por ejemplo: yeguas por temporada' }
      - { label: 'Título de la primera columna', name: tituloProcedimientos, widget: string,
          hint: 'Por ejemplo: Lo que hacemos' }
      - label: 'Primera columna — la lista'
        name: procedimientos
        widget: list
        summary: '{{fields.texto}}'
        hint: 'Un renglón por procedimiento. Se arrastran para ordenar.'
        fields:
          - { label: 'Procedimiento', name: texto, widget: string }
      - { label: 'Título de la segunda columna', name: tituloRecursos, widget: string,
          hint: 'Por ejemplo: Con qué contamos' }
      - label: 'Segunda columna — con qué contamos'
        name: recursos
        widget: list
        summary: '{{fields.titulo}}'
        fields:
          - { label: 'Título', name: titulo, widget: string }
          - { label: 'Texto', name: texto, widget: text }
      - label: 'Fotos del centro'
        name: fotos
        widget: list
        summary: '{{fields.pie}}'
        required: false
        hint: 'Fotos del trabajo: la veterinaria, la ecografía, la colecta, las yeguas. Van en una fila abajo de todo. Si no cargás ninguna, esa fila no aparece.'
        fields:
          - { label: 'Foto', name: foto, widget: image }
          - { label: 'Pie de foto', name: pie, widget: string, required: false,
              hint: 'El texto que se ve encima de la foto. Se puede dejar vacío.' }
          - { label: 'Descripción', name: alt, widget: string,
              hint: 'Qué se ve. Lo leen los buscadores y los lectores de pantalla.' }
          - { label: 'Encuadre', name: pos, widget: string, required: false,
              hint: 'Sólo si queda mal centrada. Ejemplos: 50% 30% (sube), 70% 50% (corre a la derecha).' }

      - label: 'Contacto del centro'
        name: contacto
        widget: object
        fields:
          - { label: 'WhatsApp del centro', name: intl, widget: string, required: false,
              hint: 'El número sin espacios y con 598 adelante: 59899345641. Si lo dejás vacío, la consulta va al teléfono del haras.' }
          - { label: 'Mensaje que sale escrito', name: mensaje, widget: text, required: false,
              hint: 'Lo que aparece ya tipeado en WhatsApp cuando alguien toca el botón.' }
          - { label: 'Texto del botón', name: textoBoton, widget: string, required: false,
              hint: 'Si lo dejás vacío dice “Consultar por el centro”.' }

  - name: sitio
    label: 'Datos del haras'
    icon: home_work
    file: 'content/sitio.json'
    fields:
      - { label: 'Nombre', name: nombre, widget: string }
      - { label: 'Lema', name: lema, widget: string }
      - { label: 'Ubicación', name: ubicacion, widget: string }
      - { label: 'Dirección', name: direccion, widget: string }
      - { label: 'Desde el año', name: desde, widget: number, value_type: int }
      - { label: 'Email', name: email, widget: string, required: false }
      - label: 'Teléfonos'
        name: contactos
        widget: list
        summary: '{{fields.nombre}} — {{fields.tel}}'
        fields:
          - { label: 'Nombre', name: nombre, widget: string }
          - { label: 'Rol', name: rol, widget: string }
          - { label: 'Teléfono', name: tel, widget: string, hint: 'Como se muestra: 099 345 641' }
          - { label: 'Para WhatsApp', name: intl, widget: string,
              hint: 'El mismo número sin espacios y con 598 adelante: 59899345641' }
      - label: 'Redes'
        name: redes
        widget: object
        fields:
          - { label: 'Instagram', name: instagram, widget: string, required: false }
          - { label: 'Facebook', name: facebook, widget: string, required: false }
          - { label: 'YouTube', name: youtube, widget: string, required: false }
      - label: 'Mapa'
        name: mapa
        widget: object
        fields:
          - { label: 'Latitud', name: lat, widget: number, value_type: float }
          - { label: 'Longitud', name: lng, widget: number, value_type: float }
          - { label: 'Zoom', name: zoom, widget: number, value_type: int, min: 5, max: 18 }
      - { label: 'Logo', name: logo, widget: image }
      - { label: 'Foto de portada', name: fotoPortada, widget: image,
          hint: 'La grande del principio. Conviene una apaisada y tranquila.' }
      - { label: 'Foto de “El Haras”', name: fotoHaras, widget: image }
      - { label: 'Encuadre de esa foto', name: fotoHarasPos, widget: string, required: false,
          hint: 'El marco es cuadrado. Sólo tocalo si queda mal: 50% 30% sube el encuadre, 70% 50% lo corre a la derecha.' }
